<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#17131c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ani">
  <title>Ani</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/ani-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/ani-192.png">
  <link rel="stylesheet" href="/style.css?v=33">
</head>
<body>
  <main class="companion-shell">
    <div id="profile-picker" class="profile-picker" hidden>
      <div class="profile-picker-card">
        <strong>Qui parle à Ani ?</strong>
        <div class="profile-picker-actions">
          <button type="button" data-profile="francois">François</button>
          <button type="button" data-profile="salome">Salomé</button>
        </div>
      </div>
    </div>
    <section class="stage" aria-label="Ani, compagnon animé">
      <div class="atmosphere" aria-hidden="true"><span></span><span></span><span></span></div>
      <header class="topbar">
        <div><strong>Ani</strong><span id="status"><i></i> présente</span></div>
        <div class="top-actions">
          <select id="model-selector" class="model-selector" aria-label="Modèle d’Ani"></select>
          <button id="install-button" class="install-control" type="button" hidden>Installer</button>
        </div>
      </header>

      <div id="phase-indicator" class="phase-indicator" data-phase="idle" aria-label="Prête">
        <i aria-hidden="true"></i><span class="phase-label">Prête</span>
        <span id="context-meter" class="context-meter" role="progressbar" aria-label="Contexte utilisé" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="context-meter-fill"></span></span>
        <time aria-hidden="true">00:00</time>
      </div>

      <div id="ani-avatar" class="avatar emotion-neutral" aria-live="polite">
        <div class="avatar-shadow" aria-hidden="true"></div>
        <canvas id="avatar-canvas" aria-label="Ani, avatar 3D animé"></canvas>
        <div id="avatar-loading" class="avatar-loading">Chargement d’Ani…</div>
      </div>
    </section>

    <section class="conversation" aria-label="Conversation avec Ani">
      <div id="history" class="history" aria-live="polite"><div class="history-sentinel" aria-hidden="true"></div></div>
      <form id="chat-form" autocomplete="off">
        <button id="camera-button" class="capture" type="button" aria-label="Prendre une photo">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
        </button>
        <button id="screen-button" class="capture" type="button" aria-label="Montrer mon écran">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="3" width="20" height="14" rx="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
        </button>
        <button id="mic-button" class="mic" type="button" aria-label="Parler à Ani">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>
        <label class="composer"><span class="sr-only">Message</span><input id="message-input" maxlength="12000" placeholder="Dis quelque chose à Ani…" enterkeyhint="send" autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false"></label>
        <button class="send" type="submit" aria-label="Envoyer">↑</button>
      </form>
    </section>
  </main>
  <audio id="voice-player" preload="none"></audio>
  <audio id="status-player" preload="none"></audio>
  <script src="/avatar-3d.bundle.js" defer></script>
  <script src="/app.js?v=37" defer></script>
  <script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'))</script>
</body>
</html>
