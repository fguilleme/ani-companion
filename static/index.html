<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#17131c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ani">
  <title>Ani</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/ani-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/ani-192.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="companion-shell">
    <section class="stage" aria-label="Ani, compagnon animé">
      <div class="atmosphere" aria-hidden="true"><span></span><span></span><span></span></div>
      <header class="topbar">
        <div><strong>Ani</strong><span id="status"><i></i> présente</span></div>
        <div class="top-actions">
          <button id="voice-toggle" class="round-control active" type="button" aria-label="Activer ou couper la voix" aria-pressed="true">♪</button>
          <button id="install-button" class="install-control" type="button" hidden>Installer</button>
        </div>
      </header>

      <div id="ani-avatar" class="avatar emotion-neutral" aria-live="polite">
        <div class="avatar-shadow" aria-hidden="true"></div>
        <canvas id="avatar-canvas" aria-label="Ani, avatar 3D animé"></canvas>
        <div id="avatar-loading" class="avatar-loading">Chargement d’Ani…</div>
      </div>

      <div id="speech" class="speech" hidden></div>
      <div id="thinking" class="thinking" hidden><span></span><span></span><span></span></div>
    </section>

    <section class="conversation" aria-label="Conversation avec Ani">
      <div id="history" class="history" aria-live="polite"></div>
      <form id="chat-form" autocomplete="off">
        <button id="mic-button" class="mic" type="button" aria-label="Parler à Ani">●</button>
        <label class="composer"><span class="sr-only">Message</span><input id="message-input" maxlength="12000" placeholder="Dis quelque chose à Ani…" enterkeyhint="send" autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false"></label>
        <button class="send" type="submit" aria-label="Envoyer">↑</button>
      </form>
    </section>
  </main>
  <audio id="voice-player" preload="none"></audio>
  <script src="/avatar-3d.bundle.js" defer></script>
  <script src="/app.js" defer></script>
  <script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'))</script>
</body>
</html>
